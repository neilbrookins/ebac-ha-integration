# Only the tests' settings: the integration itself is custom_components/ebac
# (see tests/, and .github/workflows/tests.yml for how they run).

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# (Home Assistant installs its httpx alias before respx is imported:
# pytest-homeassistant's README)
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]
