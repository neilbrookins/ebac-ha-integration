# A release on GitHub for each version tag (v0.6.2, say), with that
# version's notes from CHANGELOG.md, so that Marketplace (HACS) shows the
# version number and its "Read release announcement" opens the notes.
# The tag must match the version in manifest.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches manifest.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          m=$(python3 -c 'import json; print(json.load(open("custom_components/ebac/manifest.json"))["version"])')
          [ "$v" = "$m" ] || { echo "tag $GITHUB_REF_NAME, but manifest.json says $m"; exit 1; }
      - name: The notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 == "## " v { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $v"; exit 1; }
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "${GITHUB_REF_NAME#v}" --notes-file notes.md
